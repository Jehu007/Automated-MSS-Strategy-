<script>
// ========== STATE ==========
var state = {
pair:'XAU/USD',tf:'weekly',signal:null,
settings:{capital:10000,risk:0.5,swing:3,momentum:1.5,tol:0.3,apiKey:''},
journal:[],filter:'all'
};

// ========== PERSISTENCE ==========
function loadState(){
try{
var s=localStorage.getItem('mss_state');if(s)state.settings=JSON.parse(s);
var j=localStorage.getItem('mss_journal');if(j)state.journal=JSON.parse(j);
}catch(e){}
}
function saveState(){localStorage.setItem('mss_state',JSON.stringify(state.settings));}
function saveJournal(){localStorage.setItem('mss_journal',JSON.stringify(state.journal));}

// ========== SWING DETECTION ==========
function findSwings(data,left,right){
var swings=[];
for(var i=left;i<data.length-right;i++){
var isH=true,isL=true;
for(var j=i-left;j<=i+right;j++){
if(j===i)continue;
if(data[j].high>data[i].high)isH=false;
if(data[j].low<data[i].low)isL=false;
}
if(isH)swings.push({index:i,type:'high',value:data[i].high});
if(isL)swings.push({index:i,type:'low',value:data[i].low});
}
return swings;
}

function avgBody(data,index,period){
var s=Math.max(0,index-period),sum=0,cnt=0;
for(var i=s;i<index;i++){sum+=Math.abs(data[i].close-data[i].open);cnt++;}
return cnt>0?sum/cnt:1;
}

// ========== MSS DETECTION ==========
function findMSS(data,swings,momentumMult){
var results=[];
for(var i=0;i<swings.length;i++){
var sw=swings[i];
if(sw.type==='high'){
for(var j=sw.index+1;j<data.length;j++){
if(data[j].close>sw.value){
var body=data[j].close-data[j].open;
if(body>0&&body>avgBody(data,j)*momentumMult){
var lastLow=null;
for(var k=swings.length-1;k>=0;k--){
if(swings[k].type==='low'&&swings[k].index<j){lastLow=swings[k];break;}
}
if(lastLow){
results.push({type:'bullish',index:j,brokenSwing:sw,lastLow:lastLow,
zone:{high:data[lastLow.index].high,low:data[lastLow.index].low}});
}
break;
}
}
}
}
if(sw.type==='low'){
for(var j=sw.index+1;j<data.length;j++){
if(data[j].close<sw.value){
var body2=data[j].open-data[j].close;
if(body2>0&&body2>avgBody(data,j)*momentumMult){
var lastHigh=null;
for(var k=swings.length-1;k>=0;k--){
if(swings[k].type==='high'&&swings[k].index<j){lastHigh=swings[k];break;}
}
if(lastHigh){
results.push({type:'bearish',index:j,brokenSwing:sw,lastHigh:lastHigh,
zone:{high:data[lastHigh.index].high,low:data[lastHigh.index].low}});
}
break;
}
}
}
}
}
// Deduplicate by MSS index (keep last = most recent broken swing)
var map={};
for(var r of results)map[r.index]=r;
return Object.values(map);
}

function findRetracement(data,mss){
var z=mss.zone;
for(var i=mss.index+1;i<data.length;i++){
if(mss.type==='bullish'&&data[i].low<=z.high&&data[i].low>=z.low)return i;
if(mss.type==='bearish'&&data[i].high>=z.low&&data[i].high<=z.high)return i;
}
return-1;
}

function findStructureBreak(data,mss,retrIdx,swings){
for(var i=0;i<swings.length;i++){
var sw=swings[i];
if(mss.type==='bullish'&&sw.type==='high'&&sw.index>retrIdx){
for(var j=sw.index+1;j<data.length;j++){
if(data[j].close>sw.value)return{index:j,swing:sw};
}
}
if(mss.type==='bearish'&&sw.type==='low'&&sw.index>retrIdx){
for(var j=sw.index+1;j<data.length;j++){
if(data[j].close<sw.value)return{index:j,swing:sw};
}
}
}
return null;
}

function findOB(data,breakIdx,direction){
for(var i=breakIdx-1;i>=0;i--){
if(direction==='bullish'&&data[i].close<data[i].open)
return{index:i,high:data[i].high,low:data[i].low};
if(direction==='bearish'&&data[i].close>data[i].open)
return{index:i,high:data[i].high,low:data[i].low};
}
return null;
}

function findOBRetracement(data,ob,breakIdx,direction){
for(var i=breakIdx+1;i<data.length;i++){
if(direction==='bullish'&&data[i].low<=ob.high&&data[i].low>=ob.low)return i;
if(direction==='bearish'&&data[i].high>=ob.low&&data[i].high<=ob.high)return i;
}
return-1;
}

function isBullishEngulfing(data,i){
if(i<1)return false;
var p=data[i-1],c=data[i];
return p.close<p.open&&c.close>c.open&&c.open<=p.close&&c.close>=p.open;
}
function isBearishEngulfing(data,i){
if(i<1)return false;
var p=data[i-1],c=data[i];
return p.close>p.open&&c.close<c.open&&c.open>=p.close&&c.close<=p.open;
}
function isBullishThreeCandles(data,i){
if(i<2)return false;
var a=data[i-2],b=data[i-1],c=data[i];
return a.close<a.open&&b.close>b.open&&b.high>a.high&&b.low>a.low&&c.close>c.open&&c.high>b.high&&c.low>b.low;
}
function isBearishThreeCandles(data,i){
if(i<2)return false;
var a=data[i-2],b=data[i-1],c=data[i];
return a.close>a.open&&b.close<b.open&&b.high<a.high&&b.low<a.low&&c.close<c.open&&c.high<b.high&&c.low<b.low;
}

function findConfirmation(data,obRetIdx,direction){
for(var i=obRetIdx;i<data.length;i++){
if(direction==='bullish'){
if(isBullishEngulfing(data,i)||isBullishThreeCandles(data,i))return i;
}else{
if(isBearishEngulfing(data,i)||isBearishThreeCandles(data,i))return i;
}
}
return-1;
}

function findTP(data,signalIdx,direction,swings,momentumMult){
if(direction==='bullish'){
// Priority 1: bearish MSS
for(var i=0;i<swings.length;i++){
if(swings[i].type==='low'&&swings[i].index>signalIdx){
for(var j=swings[i].index+1;j<data.length;j++){
if(data[j].close<swings[i].value){
var body=data[j].open-data[j].close;
if(body>0&&body>avgBody(data,j)*momentumMult)return data[j].close;
break;
}
}
}
}
// Priority 2: next swing high (liquidity)
for(var i=0;i<swings.length;i++){
if(swings[i].type==='high'&&swings[i].index>signalIdx)return swings[i].value;
}
// Fallback: recent high
var mx=0;
for(var i=signalIdx+1;i<data.length;i++)if(data[i].high>mx)mx=data[i].high;
return mx>0?mx:null;
}else{
for(var i=0;i<swings.length;i++){
if(swings[i].type==='high'&&swings[i].index>signalIdx){
for(var j=swings[i].index+1;j<data.length;j++){
if(data[j].close>swings[i].value){
var body=data[j].close-data[j].open;
if(body>0&&body>avgBody(data,j)*momentumMult)return data[j].close;
break;
}
}
}
}
for(var i=0;i<swings.length;i++){
if(swings[i].type==='low'&&swings[i].index>signalIdx)return swings[i].value;
}
var mn=Infinity;
for(var i=signalIdx+1;i<data.length;i++)if(data[i].low<mn)mn=data[i].low;
return mn<Infinity?mn:null;
}
}

// ========== MAIN ANALYSIS ==========
function analyzeMSS(data,params){
var debug=[];
var swings=findSwings(data,params.swing,params.swing);
debug.push('Swings trouvés: '+swings.length);

var mssList=findMSS(data,swings,params.momentum);
debug.push('MSS détectés: '+mssList.length);

var signals=[];
for(var m of mssList){
var retIdx=findRetracement(data,m);
if(retIdx===-1){debug.push('MSS@'+m.index+': pas de retracement');continue;}

var brk=findStructureBreak(data,m,retIdx,swings);
if(!brk){debug.push('MSS@'+m.index+': pas de cassure médium');continue;}

var ob=findOB(data,brk.index,m.type);
if(!ob){debug.push('MSS@'+m.index+': pas d OB');continue;}

var obRet=findOBRetracement(data,ob,brk.index,m.type);
if(obRet===-1){debug.push('MSS@'+m.index+': pas de retracement OB');continue;}

var conf=findConfirmation(data,obRet,m.type);
if(conf===-1){debug.push('MSS@'+m.index+': pas de confirmation');continue;}

var entry=data[conf].close;
var buffer=entry*0.001;
var stop=m.type==='bullish'?ob.low-buffer:ob.high+buffer;
var tp=findTP(data,conf,m.type,swings,params.momentum);
var rr=tp?Math.abs(tp-entry)/Math.abs(entry-stop):null;

signals.push({
direction:m.type,entry:entry,stop:stop,tp:tp,rr:rr,
mssIndex:m.index,zoneIndex:m.lastLow?m.lastLow.index:m.lastHigh.index,
retracementIndex:retIdx,breakIndex:brk.index,obIndex:ob.index,
confirmationIndex:conf,mssZone:m.zone,obZone:{high:ob.high,low:ob.low},
debug:{swings:swings.length,mss:mssList.length,retracement:retIdx,break:brk.index,ob:ob.index,confirmation:conf}
});
debug.push('SIGNAL TROUVÉ @'+conf+': '+m.type+' entry='+entry.toFixed(2)+' stop='+stop.toFixed(2)+' tp='+(tp?tp.toFixed(2):'null'));
}
return{signals:signals,debug:debug,swings:swings};
}

d.push(c(1950,1955,1930,1940));//30 entering zone

// Bounce
d.push(c(1900,1955,1895,1950));//35

d.push(c(1955,1960,1935,1940));//38

// ========== TWELVE DATA FETCH ==========
async function fetchTwelveData(symbol,interval,apiKey){
var url='https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(symbol)+
'&interval='+interval+'&outputsize=100&apikey='+apiKey;
var resp=await fetch(url);
var json=await resp.json();
if(json.status==='error')throw new Error(json.message||'API error');
if(!json.values||!json.values.length)throw new Error('Pas de données');
return json.values.reverse().map(function(v){
return{time:v.datetime,open:parseFloat(v.open),high:parseFloat(v.high),
low:parseFloat(v.low),close:parseFloat(v.close)};
});
}

function getInterval(tf){
if(tf==='weekly')return['1week','4h','15min'];
if(tf==='daily')return['1day','1h','15min'];
return['4h','15min','5min'];
}

// ========== CHART ==========
function drawChart(data,signal){
var canvas=document.getElementById('chart');
var ctx=canvas.getContext('2d');
canvas.style.display='block';

// Show last 40 candles around signal
var sigIdx=signal.confirmationIndex;
var start=Math.max(0,sigIdx-25);
var end=Math.min(data.length,sigIdx+15);
var visible=data.slice(start,end);
var n=visible.length;

var w=canvas.width=canvas.offsetWidth*2;
var h=canvas.height=600;
var padTop=20,padBot=30,padLeft=50,padRight=20;
var chartW=w-padLeft-padRight;
var chartH=h-padTop-padBot;

var allVals=[];
for(var d of visible){allVals.push(d.high,d.low);}
if(signal.entry)allVals.push(signal.entry);
if(signal.stop)allVals.push(signal.stop);
if(signal.tp)allVals.push(signal.tp);

var mn=Math.min.apply(null,allVals)*0.995;
var mx=Math.max.apply(null,allVals)*1.005;
var range=mx-mn;
if(range<0.001)range=1;

var candleW=Math.floor(chartW/n*0.7);
var gap=Math.floor(chartW/n);

function yToPx(v){return padTop+chartH-(v-mn)/range*chartH;}

// Background
ctx.fillStyle=window.matchMedia('(prefers-color-scheme:dark)').matches?'#1c1c1e':'#fff';
ctx.fillRect(0,0,w,h);

// Grid
ctx.strokeStyle=window.matchMedia('(prefers-color-scheme:dark)').matches?'#3a3a3c':'#e0e0e0';
ctx.lineWidth=1;
ctx.font='20px sans-serif';
ctx.fillStyle=window.matchMedia('(prefers-color-scheme:dark)').matches?'#aaa':'#666';
for(var g=0;g<=4;g++){
var gy=padTop+chartH*g/4;
var gv=mx-range*(1-g/4);
ctx.beginPath();ctx.moveTo(padLeft,gy);ctx.lineTo(padLeft+chartW,gy);ctx.stroke();
ctx.fillText(gv.toFixed(1),2,gy+5);
}

// Candles
for(var i=0;i<n;i++){
var d=visible[i];
var x=padLeft+gap*i+gap/2;
var isBull=d.close>=d.open;
ctx.fillStyle=isBull?'#34c759':'#ff3b30';
ctx.strokeStyle=isBull?'#34c759':'#ff3b30';
ctx.lineWidth=2;
// Wick
ctx.beginPath();ctx.moveTo(x,yToPx(d.high));ctx.lineTo(x,yToPx(d.low));ctx.stroke();
// Body
var yO=yToPx(d.open),yC=yToPx(d.close);
var bh=Math.max(2,Math.abs(yC-yO));
ctx.fillRect(x-candleW/2,Math.min(yO,yC),candleW,bh);
}

// OB Zone
var obStart=signal.obIndex-start;
if(obStart>=0&&obStart<n){
var obX1=padLeft+gap*obStart;
var obX2=padLeft+gap*(obStart+1);
ctx.fillStyle='rgba(255,149,0,0.15)';
ctx.fillRect(obX1,yToPx(signal.obZone.high),gap,yToPx(signal.obZone.low)-yToPx(signal.obZone.high));
}

// Entry line
ctx.strokeStyle='#007aff';ctx.lineWidth=2;ctx.setLineDash([8,4]);
ctx.beginPath();ctx.moveTo(padLeft,yToPx(signal.entry));ctx.lineTo(padLeft+chartW,yToPx(signal.entry));ctx.stroke();
ctx.fillStyle='#007aff';ctx.fillText('E: '+signal.entry.toFixed(1),padLeft+chartW-80,yToPx(signal.entry)-5);

// Stop line
ctx.strokeStyle='#ff3b30';
ctx.beginPath();ctx.moveTo(padLeft,yToPx(signal.stop));ctx.lineTo(padLeft+chartW,yToPx(signal.stop));ctx.stroke();
ctx.fillStyle='#ff3b30';ctx.fillText('S: '+signal.stop.toFixed(1),padLeft+chartW-80,yToPx(signal.stop)-5);

// TP line
if(signal.tp){
ctx.strokeStyle='#34c759';
ctx.beginPath();ctx.moveTo(padLeft,yToPx(signal.tp));ctx.lineTo(padLeft+chartW,yToPx(signal.tp));ctx.stroke();
ctx.fillStyle='#34c759';ctx.fillText('TP: '+signal.tp.toFixed(1),padLeft+chartW-80,yToPx(signal.tp)-5);
}
ctx.setLineDash([]);
}

// ========== JOURNAL ==========
function addTrade(){
var t={
id:Date.now(),
pair:document.getElementById('jPair').value,
direction:document.getElementById('jDir').value,
entry:parseFloat(document.getElementById('jEntry').value),
stop:parseFloat(document.getElementById('jStop').value),
tp:parseFloat(document.getElementById('jTP').value),
status:document.getElementById('jStatus').value,
notes:document.getElementById('jNotes').value,
date:new Date().toISOString()
};
if(!t.entry||!t.stop){alert('Veuillez entrer l entrée et le stop.');return;}
t.rr=t.tp?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.stop):null;
state.journal.push(t);
saveJournal();
renderJournal();renderStats();
// Clear form
document.getElementById('jEntry').value='';document.getElementById('jStop').value='';
document.getElementById('jTP').value='';document.getElementById('jNotes').value='';
alert('Trade ajouté !');
}

function updateTradeStatus(id,status){
for(var t of state.journal){if(t.id===id)t.status=status;}
saveJournal();renderJournal();renderStats();
}
function deleteTrade(id){
state.journal=state.journal.filter(function(t){return t.id!==id;});
saveJournal();renderJournal();renderStats();
}

function setFilter(f,btn){
state.filter=f;
document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
if(btn)btn.classList.add('active');
renderJournal();
}

function renderJournal(){
var list=document.getElementById('tradeList');
var filtered=state.journal;
if(state.filter!=='all')filtered=state.journal.filter(function(t){return t.status===state.filter;});
if(filtered.length===0){list.innerHTML='<p style="text-align:center;color:var(--text2);padding:20px;">Aucun trade.</p>';return;}

var badges={open:'<span class="badge badge-open">Ouvert</span>',win:'<span class="badge badge-win">Gagné</span>',loss:'<span class="badge badge-loss">Perdu</span>',be:'<span class="badge badge-be">BE</span>'};
var html='';
for(var t of filtered){
var rrText=t.rr?t.rr.toFixed(2)+'R':'';
html+='<div class="trade-item '+t.direction+'">'+
'<div class="header"><span class="pair">'+t.pair+' '+(t.direction==='long'?'📈':'📉')+'</span>'+badges[t.status]+'</div>'+
'<div style="font-size:13px;">Entrée: '+t.entry+' | Stop: '+t.stop+(t.tp?' | TP: '+t.tp:'')+'</div>'+
'<div style="font-size:12px;color:var(--text2);margin-top:4px;">R:R: '+rrText+' | '+new Date(t.date).toLocaleDateString('fr-FR')+'</div>'+
(t.notes?'<div style="font-size:12px;color:var(--text2);margin-top:4px;font-style:italic;">'+t.notes+'</div>':'')+
'<div class="trade-actions">'+
(t.status==='open'?'<button class="btn btn-green btn-small" onclick="updateTradeStatus('+t.id+',\'win\')">✓ Gagné</button><button class="btn btn-red btn-small" onclick="updateTradeStatus('+t.id+',\'loss\')">✗ Perdu</button><button class="btn btn-outline btn-small" onclick="updateTradeStatus('+t.id+',\'be\')">≈ BE</button>':'')+
'<button class="btn btn-outline btn-small" onclick="deleteTrade('+t.id+')">🗑 Suppr</button>'+
'</div></div>';
}
list.innerHTML=html;
}

// ========== STATS ==========
function renderStats(){
var el=document.getElementById('statsContent');
if(state.journal.length===0){el.innerHTML='<div class="no-signal"><div class="icon">📊</div>Aucune donnée. Ajoutez des trades dans le journal.</div>';return;}

var trades=state.journal;
var total=trades.length;
var wins=trades.filter(function(t){return t.status==='win';}).length;
var losses=trades.filter(function(t){return t.status==='loss';}).length;
var bes=trades.filter(function(t){return t.status==='be';}).length;
var open=trades.filter(function(t){return t.status==='open';}).length;
var closed=wins+losses+bes;
var winRate=closed>0?Math.round(wins/closed*100):0;

var totalR=0;
for(var t of trades){
if(t.rr){
if(t.status==='win')totalR+=t.rr;
else if(t.status==='loss')totalR-=1;
}
}
var riskAmt=state.settings.capital*state.settings.risk/100;
var totalPnL=totalR*riskAmt;

var bestTrade=0,worstTrade=0;
for(var t of trades){
if(t.rr){
var pnl=t.status==='win'?t.rr*riskAmt:t.status==='loss'?-riskAmt:0;
if(pnl>bestTrade)bestTrade=pnl;
if(pnl<worstTrade)worstTrade=pnl;
}
}

var longs=trades.filter(function(t){return t.direction==='long';}).length;
var shorts=trades.filter(function(t){return t.direction==='short';}).length;
var gold=trades.filter(function(t){return t.pair==='XAU/USD';}).length;
var btc=trades.filter(function(t){return t.pair==='BTC/USD';}).length;

el.innerHTML=
'<div class="stat-grid">'+
'<div class="stat-box"><div class="num">'+total+'</div><div class="lbl">Trades</div></div>'+
'<div class="stat-box"><div class="num" style="color:'+(winRate>=50?'var(--green)':'var(--red)')+'">'+winRate+'%</div><div class="lbl">Win Rate</div></div>'+
'<div class="stat-box"><div class="num" style="color:'+(totalR>=0?'var(--green)':'var(--red)')+'">'+(totalR>=0?'+':'')+totalR.toFixed(2)+'R</div><div class="lbl">P&L (R)</div></div>'+
'<div class="stat-box"><div class="num" style="color:'+(totalPnL>=0?'var(--green)':'var(--red)')+'">'+(totalPnL>=0?'+':'')+totalPnL.toFixed(0)+'$</div><div class="lbl">P&L ($)</div></div>'+
'<div class="stat-box"><div class="num" style="color:var(--green)">'+bestTrade.toFixed(0)+'$</div><div class="lbl">Meilleur</div></div>'+
'<div class="stat-box"><div class="num" style="color:var(--red)">'+worstTrade.toFixed(0)+'$</div><div class="lbl">Pire</div></div>'+
'<div class="stat-box"><div class="num">'+wins+'</div><div class="lbl">Gagnés</div></div>'+
'<div class="stat-box"><div class="num">'+losses+'</div><div class="lbl">Perdus</div></div>'+
'<div class="stat-box"><div class="num">'+open+'</div><div class="lbl">Ouverts</div></div>'+
'<div class="stat-box"><div class="num">'+bes+'</div><div class="lbl">Breakeven</div></div>'+
'</div>'+
'<div class="section-title">Répartition</div>'+
'<div class="stat-grid">'+
'<div class="stat-box"><div class="num">📈 '+longs+'</div><div class="lbl">Longs</div></div>'+
'<div class="stat-box"><div class="num">📉 '+shorts+'</div><div class="lbl">Shorts</div></div>'+
'<div class="stat-box"><div class="num">🥇 '+gold+'</div><div class="lbl">Or</div></div>'+
'<div class="stat-box"><div class="num">₿ '+btc+'</div><div class="lbl">BTC</div></div>'+
'</div>';
}
