<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e141b">
<title>MSS Trading</title>
<style>
  :root{ --bg:#0e141b; --card:#161e28; --line:#242e3a; --text:#e8eef5; --muted:#8b98a8; --green:#22c55e; --red:#ef4444; --accent:#3b82f6; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7fa; --card:#ffffff; --line:#e2e8f0; --text:#111827; --muted:#6b7280; }
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:70px; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:10; }
  header h1{ font-size:18px; font-weight:700; }
  header .dot{ width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.2); }
  .wrap{ padding:14px 18px; display:flex; flex-direction:column; gap:14px; max-width:520px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2{ font-size:15px; font-weight:600; margin-bottom:10px; }
  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:8px 4px; font-size:13px; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:500; }
  .pos{ color:var(--green); font-weight:600; } .neg{ color:var(--red); font-weight:600; }
  .btn{ display:block; width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
  .btn.ghost{ background:var(--card); border:1px solid var(--line); color:var(--text); }
  label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input,select{ width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
  input:focus,select:focus{ outline:2px solid var(--accent); }
  .row{ display:flex; gap:10px; } .row input,.row select{ flex:1; }
  .row2{ display:flex; gap:8px; }
  .badge{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.long{ background:rgba(34,197,94,.15); color:var(--green); }
  .badge.short{ background:rgba(239,68,68,.15); color:var(--red); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .stat .k{ font-size:11px; color:var(--muted); } .stat .v{ font-size:16px; font-weight:700; margin-top:3px; }
  nav{ position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button{ flex:1; padding:14px 6px; background:none; border:none; color:var(--muted); font-size:11px; font-weight:600; cursor:pointer; }
  nav button.active{ color:var(--accent); }
  .pg{ display:none; } .pg.show{ display:block; }
  .muted{ color:var(--muted); font-size:12px; }
  .log{ margin-top:8px; font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>MSS Trading</h1>
  <span class="dot" title="actif"></span>
</header>

<main class="wrap">

  <!-- SIGNAL -->
  <section id="pg-signal" class="pg show">
    <div class="grid" style="margin-bottom:14px;">
      <div class="stat"><div class="k">Capital total</div><div class="v" id="cap">—</div></div>
      <div class="stat"><div class="k">Risque / trade</div><div class="v">0,5 %</div></div>
    </div>

    <div class="card">
      <h2>Dernier signal MSS</h2>
      <div id="signalBody">
        <p class="muted">Aucun signal pour le moment. Calculez un signal ou chargez des données.</p>
      </div>
      <button class="btn" style="margin-top:12px;" onclick="calculerSignal()">Calculer un signal</button>
      <button class="btn ghost" style="margin-top:8px;" onclick="goTo('journal')">Journal de trades</button>
    </div>

    <div class="card">
      <h2>Paires suivies</h2>
      <table>
        <tr><th>Paire</th><th>Structure</th><th>Statut</th></tr>
        <tr><td>Gold (XAU/USD)</td><td id="stGold">—</td><td><span class="badge long">Actif</span></td></tr>
        <tr><td>Bitcoin (BTC/USD)</td><td id="stBtc">—</td><td><span class="badge long">Actif</span></td></tr>
      </table>
    </div>
  </section>

  <!-- JOURNAL -->
  <section id="pg-journal" class="pg">
    <div class="card">
      <h2>Nouveau trade</h2>
      <label>Paire</label>
      <select id="jPaire"><option>Gold (XAU/USD)</option><option>Bitcoin (BTC/USD)</option></select>
      <div class="row" style="margin-top:10px;">
        <div><label>Sens</label><select id="jSens"><option value="long">Long</option><option value="short">Short</option></select></div>
        <div><label>Entrée</label><input id="jEntree" inputmode="decimal" placeholder="0.00"></div>
      </div>
      <div class="row">
        <div><label>Stop</label><input id="jStop" inputmode="decimal" placeholder="0.00"></div>
        <div><label>TP</label><input id="jTP" inputmode="decimal" placeholder="0.00"></div>
      </div>
      <button class="btn" style="margin-top:14px;" onclick="ajouterTrade()">Ajouter le trade</button>
    </div>

    <div class="card">
      <h2>Trades enregistrés</h2>
      <div id="journalList"><p class="muted">Aucun trade saisi.</p></div>
    </div>
  </section>

</main>

<nav>
  <button class="active" onclick="nav('signal')">Signal</button>
  <button onclick="nav('journal')">Journal</button>
</nav>

<script>
// --- Moteur MSS simplifié (structure + momentum + OB + confirmation) ---
function analyzer(ohlc){
  // ohlc: [{o,h,l,c}] chronologique
  const n = ohlc.length; if(n < 20) return {error:'Pas assez de données'};
  const bodies = ohlc.map(b => Math.abs(b.c - b.o));
  const avgB = bodies.slice(-20).reduce((a,b)=>a+b,0)/20;
  const last = ohlc[n-1];
  const prevHigh = Math.max(...ohlc.slice(-6,-1).map(b=>b.h));
  const prevLow = Math.min(...ohlc.slice(-6,-1).map(b=>b.l));
  let dir = 'range';
  if(last.c > prevHigh) dir = 'haussier';
  else if(last.c < prevLow) dir = 'baissier';
  const momentum = bodies[n-1] > avgB * 1.8;
  let signal = null;
  if(momentum && dir === 'haussier'){
    const ob = ohlc.findLast(b => b.c < b.o) || ohlc[n-2];
    signal = {
      sens:'LONG', mss:'Haussier',
      zone:[Math.min(...ohlc.slice(-6,-1).map(b=>b.l)), Math.max(...ohlc.slice(-6,-1).map(b=>b.h))],
      ob:[ob.l, ob.h], stop:ob.l,
      momentum
    };
  } else if(momentum && dir === 'baissier'){
    const ob = ohlc.findLast(b => b.c > b.o) || ohlc[n-2];
    signal = {
      sens:'SHORT', mss:'Baissier',
      zone:[Math.min(...ohlc.slice(-6,-1).map(b=>b.l)), Math.max(...ohlc.slice(-6,-1).map(b=>b.h))],
      ob:[ob.l, ob.h], stop:ob.h,
      momentum
    };
  }
  return { dir, momentum, signal };
}

// --- Données d'exemple (à remplacer par les vraies données) ---
let SAMPLE = {
  gold: [], btc: []
};

function calculerSignal(){
  const body = document.getElementById('signalBody');
  const demo = [];
  let p = 1950;
  for(let i=0;i<60;i++){ p += (Math.random()-0.48)*8; demo.push({o:p, h:p+4, l:p-4, c:p+(Math.random()-0.5)*8}); }
  const r = analyzer(demo);
  document.getElementById('stGold').textContent = r.dir.charAt(0).toUpperCase()+r.dir.slice(1);
  if(r.signal){
    body.innerHTML = '<span class="badge '+(r.signal.sens==='LONG'?'long':'short')+'">'+r.signal.sens+'</span>'+
      '<table style="margin-top:12px;">'+
      '<tr><th>MSS</th><td>'+r.signal.mss+'</td></tr>'+
      '<tr><th>Entrée (OB)</th><td>'+r.signal.ob[0].toFixed(2)+' – '+r.signal.ob[1].toFixed(2)+'</td></tr>'+
      '<tr><th>Stop</th><td>'+r.signal.stop.toFixed(2)+'</td></tr>'+
      '<tr><th>Zone MSS</th><td>'+r.signal.zone[0].toFixed(2)+' – '+r.signal.zone[1].toFixed(2)+'</td></tr>'+
      '</table>';
  } else {
    body.innerHTML = '<p class="muted">Pas de MSS à fort momentum détecté sur l\'échantillon. Structure : <b>'+r.dir+'</b>.</p>';
  }
}

// --- Journal ---
let trades = JSON.parse(localStorage.getItem('mss_trades') || '[]');
function ajouterTrade(){
  const t = {
    paire: document.getElementById('jPaire').value,
    sens: document.getElementById('jSens').value,
    entree: parseFloat(document.getElementById('jEntree').value) || 0,
    stop: parseFloat(document.getElementById('jStop').value) || 0,
    tp: parseFloat(document.getElementById('jTP').value) || 0,
    date: new Date().toISOString().slice(0,10)
  };
  if(!t.entree){ alert('Renseignez au moins le prix d\'entrée.'); return; }
  trades.push(t); localStorage.setItem('mss_trades', JSON.stringify(trades));
  document.getElementById('jEntree').value=''; document.getElementById('jStop').value=''; document.getElementById('jTP').value='';
  renderJournal();
}
function renderJournal(){
  const el = document.getElementById('journalList');
  if(!trades.length){ el.innerHTML='<p class="muted">Aucun trade saisi.</p>'; return; }
  el.innerHTML = trades.map(t=>{
    const rr = (t.stop && t.tp && t.entree) ? Math.abs(t.tp-t.entree)/Math.abs(t.entree-t.stop) : 0;
    return '<table><tr><th>'+t.date+'</th><td><span class="badge '+(t.sens==='long'?'long':'short')+'">'+t.sens.toUpperCase()+'</span> '+t.paire+'</td></tr>'+
      '<tr><th>Entrée</th><td>'+t.entree+'</td></tr>'+
      '<tr><th>Stop</th><td>'+t.stop+'</td></tr>'+
      '<tr><th>TP</th><td>'+t.tp+'</td></tr>'+
      '<tr><th>R:R</th><td>'+(rr?rr.toFixed(2):'—')+'</td></tr></table>';
  }).join('');
}
function nav(pg){
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('show'));
  document.getElementById('pg-'+pg).classList.add('show');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('nav button')[pg==='signal'?0:1].classList.add('active');
}
function goTo(pg){ nav(pg); }
renderJournal();
</script>
</body>
</html>
